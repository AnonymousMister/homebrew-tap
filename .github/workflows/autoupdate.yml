name: Auto Update Casks

on:
  schedule:
    # 每日北京时间凌晨 04:00 (UTC 20:00) 自动巡检
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持手动点击一键触发
  push:
    branches:
      - main
    paths:
      - '.github/workflows/autoupdate.yml'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  update-casks:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cask Updater
        id: update
        run: |
          python3 scripts/update_casks.py

      - name: Publish Release Assets
        if: steps.update.outputs.has_release_asset == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/publish_assets.py "${{ steps.update.outputs.release_manifest }}"

      - name: Commit & Push Changes
        if: steps.update.outputs.has_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/
          if git diff --cached --quiet; then
            echo "✨ 没有检测到实质文件变动，跳过提交与推送。"
          else
            git commit -m "${{ steps.update.outputs.commit_msg }}"
            git push
          fi
