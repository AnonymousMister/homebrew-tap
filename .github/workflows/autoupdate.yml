name: Auto Update Casks

on:
  schedule:
    # 每日北京时间凌晨 04:00 (UTC 20:00) 自动巡检
    - cron: '0 20 * * *'
  workflow_dispatch: # 支持手动点击一键触发

permissions:
  contents: write

jobs:
  update-casks:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cask Updater
        id: update
        run: |
          python3 scripts/update_casks.py

      - name: Commit & Push Changes
        if: steps.update.outputs.has_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/
          git commit -m "${{ steps.update.outputs.commit_msg }}"
          git push
